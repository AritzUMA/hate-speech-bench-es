<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutcracker Benchmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;background:#f9f9f7;color:#1a1a1a;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:2.5rem 1.5rem}
.gh-btn{position:fixed;top:14px;right:18px;display:flex;align-items:center;gap:7px;background:#fff;border:0.5px solid #d0d0d0;border-radius:8px;padding:6px 12px;font-size:12px;color:#333;text-decoration:none;z-index:1000;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:box-shadow .15s}
.gh-btn:hover{box-shadow:0 2px 8px rgba(0,0,0,.15);color:#000}
.header{margin-bottom:3rem;padding-bottom:2rem;border-bottom:0.5px solid #e0e0e0}
.header h1{font-family:'EB Garamond',serif;font-size:56px;font-weight:700;margin-bottom:.4rem;letter-spacing:-.3px;text-align:center}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e7d32;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.header-meta{font-size:12px;color:#6b7280;margin-bottom:1rem}
.header-desc{font-size:14px;color:#444;max-width:100%;margin-bottom:1rem;line-height:1.75}
.header-method{font-size:13px;color:#666;margin-bottom:1rem;line-height:1.8}
.section{margin-bottom:3.5rem}
.section-header{display:flex;align-items:baseline;gap:12px;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:0.5px solid #eee}
.section-header h2{font-size:16px;font-weight:600}
.section-sub{font-size:12px;color:#6b7280}
.chart-wrap{background:#fff;border:0.5px solid #e0e0e0;border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1.5rem}
.chart-label{font-size:12px;color:#4b5563;margin-bottom:.6rem}
.chart-box{position:relative;height:420px}
.chart-box-scatter{position:relative;height:420px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden;border:0.5px solid #e0e0e0}
th{padding:9px 12px;text-align:left;font-weight:500;font-size:12px;color:#4b5563;background:#fafaf8;border-bottom:0.5px solid #e8e8e8;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{background:#f0f0ee}
td{padding:8px 12px;border-bottom:0.5px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.bar-wrap{display:flex;align-items:center;gap:8px}
.bar-bg{flex:1;height:5px;background:#eee;border-radius:3px;min-width:50px}
.bar-fill{height:5px;border-radius:3px}
.tag{font-size:10px;padding:2px 7px;border-radius:12px;background:#eef;color:#336;white-space:nowrap}
.tag-ds{font-size:10px;padding:2px 7px;border-radius:12px;background:#fef3e2;color:#b45309}
.tag-backend{padding:2px 7px;border-radius:12px;font-size:10px}
.tag-backend.vllm{background:#eff6ff;color:#1d4ed8}
.tag-backend.ollama{background:#f0fdf4;color:#166534}
.chip{padding:4px 12px;border:0.5px solid #ddd;border-radius:20px;font-size:12px;cursor:pointer;background:#fff;color:#555;transition:all .15s}
.chip:hover{border-color:#999;color:#111}
.chip.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.controls{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.r1{color:#B8860B;font-weight:600}
.r2{color:#71717a;font-weight:500}
.r3{color:#6366f1}
.rank{color:#9ca3af;font-size:12px}
select{font-size:12px;padding:5px 9px;border-radius:7px;border:0.5px solid #ddd;background:#fff;cursor:pointer}
.cov-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.info-box{background:#f0f4ff;border:0.5px solid #c7d2fe;border-radius:8px;padding:.8rem 1rem;font-size:12px;color:#4338ca;margin-bottom:1rem}
.fatal-box{max-width:760px;margin:60px auto;padding:24px;font-family:system-ui,sans-serif;border:1px solid #fca5a5;background:#fef2f2;border-radius:10px;color:#991b1b}
.fatal-box h2{margin:0 0 8px;font-size:18px}
.fatal-box p{font-size:13px;color:#7f1d1d;word-break:break-word}
.fatal-box .hint{font-size:12px;color:#9ca3af;margin-top:10px}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Red de seguridad: si algo falla al arrancar, mostramos el error en pantalla
   en lugar de dejar la pagina en blanco (caso tipico en GitHub Pages). */
(function(){
  function showError(msg){
    var root = document.getElementById('root');
    if (root && !root.hasChildNodes()){
      root.innerHTML =
        '<div class="fatal-box">'
        + '<h2>No se pudo cargar el dashboard</h2>'
        + '<p>' + String(msg) + '</p>'
        + '<p class="hint">Abre la consola (F12) para mas detalle. Comprueba que '
        + '<b>runs_index.json</b> esta junto a index.html y que los CDN (react, chart.js, babel) cargan.</p>'
        + '</div>';
    }
  }
  window.addEventListener('error', function(e){ showError((e && e.message) || 'Error de script'); });
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason; showError((r && (r.message || r)) || 'Promesa rechazada');
  });
  window.addEventListener('DOMContentLoaded', function(){
    var missing = [];
    if (typeof React === 'undefined')    missing.push('React');
    if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
    if (typeof Chart === 'undefined')    missing.push('Chart.js');
    if (typeof Babel === 'undefined')    missing.push('Babel');
    if (missing.length) showError('No cargaron dependencias: ' + missing.join(', ') + '. Posible bloqueo de CDN o red.');
  });
})();
</script>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

const CDN   = 'https://unpkg.com/@lobehub/icons-static-png@latest/light/';
const LOGOS = 'https://aritzuma.github.io/hate-speech-bench-es/logos/';
const FAMILY_ICON = {
  'LLaMA 3.1':   CDN+'meta.png', 'LLaMA': CDN+'meta.png', 'LLaMA 3.2': CDN+'meta.png', 'Llama': CDN+'meta.png',
  'Gemma 2':     CDN+'gemma.png', 'Gemma 3': CDN+'gemma.png', 'Gemma 4': CDN+'gemma.png', 'Gemma': CDN+'gemma.png',
  'Qwen 2.5':    CDN+'qwen.png', 'Qwen 3': CDN+'qwen.png', 'Qwen 3.5': CDN+'qwen.png', 'Qwen': CDN+'qwen.png',
  'Mistral':     CDN+'mistral.png', 'DeepSeek R1': CDN+'deepseek.png',
  'Phi 3':       CDN+'microsoft.png', 'Phi 3.5': CDN+'microsoft.png', 'Phi': CDN+'microsoft.png',
  'Yi':          CDN+'yi.png', 'StableLM 2': CDN+'stability-ai.png', 'GPT-OSS': CDN+'openai.png',
  'Salamandra':  LOGOS+'salamandra.png', 'OpenEuroLLM': LOGOS+'openeurollm.png',
  'Moondream':   LOGOS+'moondream.png', 'LLaVA': CDN+'meta.png', 'InternVL': CDN+'internlm.png',
  'MiniCPM':     CDN+'minicpm.png', 'Granite': CDN+'ibm.png',
};
const COLORS = {
  'LLaMA 3.1':'#3b82f6','LLaMA':'#3b82f6','Gemma 2':'#10b981','Gemma 3':'#059669','Gemma 4':'#047857',
  'Qwen 2.5':'#f59e0b','Qwen 3':'#d97706','Qwen 3.5':'#b45309','Mistral':'#8b5cf6','DeepSeek R1':'#ec4899',
  'Salamandra':'#f97316','GPT-OSS':'#6b7280','Yi':'#6366f1','Phi 3.5':'#14b8a6','Phi 3':'#0d9488',
  'StableLM 2':'#9ca3af','OpenEuroLLM':'#84cc16','LLaMA 3.2':'#3b82f6','Llama':'#3b82f6','Phi':'#14b8a6',
  'Gemma':'#10b981','Qwen':'#f59e0b','LLaVA':'#f97316','InternVL':'#6366f1','MiniCPM':'#06b6d4',
  'Granite':'#334155','Moondream':'#8b5cf6',
};
const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const METRICS = [
  {key:'macro_f1',        label:'Macro-F1'},
  {key:'macro_f1_binary', label:'Macro-F1 (binario)'},
  {key:'hate_f1',         label:'Hate F1'},
  {key:'precision',       label:'Precision'},
  {key:'recall',          label:'Recall'},
  {key:'accuracy',        label:'Accuracy'},
];
const col = f => COLORS[f] || '#6b7280';
const fmt = (v, coverage) => {
  if (v == null || (v === 0 && coverage === 0)) return '-';
  return v.toFixed(4);
};

const loadedImgs = {};
Object.entries(FAMILY_ICON).forEach(([fam, url]) => {
  if (loadedImgs[fam]) return;
  const img = new Image(); img.src = url; loadedImgs[fam] = img;
});

const logoPlugin = {
  id: 'logoPlugin',
  afterDraw(chart) {
    const ctx = chart.ctx;
    const meta = chart.getDatasetMeta(0);
    const fams = chart.data.datasets[0]._families || [];
    const size = 18;
    meta.data.forEach((bar, i) => {
      const fam = fams[i];
      const img = loadedImgs[fam];
      if (!img || !img.complete || !img.naturalWidth) return;
      ctx.drawImage(img, bar.x - size/2, bar.y - size - 5, size, size);
    });
  }
};
if (typeof Chart !== 'undefined') Chart.register(logoPlugin);

function SortTh({k, label, sortKey, sortDir, onSort}) {
  return (
    <th onClick={() => onSort(k)}>
      {label}
      <span style={{color:'#9ca3af', marginLeft:3}}>
        {sortKey===k ? (sortDir==='desc' ? ' ▼' : ' ▲') : ''}
      </span>
    </th>
  );
}

function Leaderboard({DATA, ds, setDs}) {
  const [sortKey, setSortKey] = useState('macro_f1');
  const [sortDir, setSortDir] = useState('desc');
  function onSort(k) {
    if (k === sortKey) setSortDir(d => d==='desc' ? 'asc' : 'desc');
    else { setSortKey(k); setSortDir('desc'); }
  }
  const isOv = ds === '__overall__';
  const rows = useMemo(() => {
    const r = DATA.models
      .filter(m => isOv ? DATA.overall[m] : DATA.results[m] && DATA.results[m][ds])
      .map(m => ({
        model: m, display_name: DATA.models_meta[m] ? DATA.models_meta[m].display_name : m,
        family: DATA.models_meta[m] ? DATA.models_meta[m].family : '',
        params: DATA.models_meta[m] ? DATA.models_meta[m].params : '',
        developer: DATA.models_meta[m] ? DATA.models_meta[m].developer : '',
        release_date: DATA.models_meta[m] ? DATA.models_meta[m].release_date : '',
        ...(isOv ? DATA.overall[m] : DATA.results[m][ds]),
      }));
    r.sort((a, b) => sortDir==='desc'
      ? (b[sortKey] != null ? b[sortKey] : -1) - (a[sortKey] != null ? a[sortKey] : -1)
      : (a[sortKey] != null ? a[sortKey] : -1) - (b[sortKey] != null ? b[sortKey] : -1));
    return r;
  }, [ds, sortKey, sortDir, DATA]);

  const maxVal = Math.max(...rows.map(r => r[sortKey] || 0));

  return (
    <div className="section">
      <div className="section-header">
        <h2>Leaderboard</h2>
        <span className="section-sub">{DATA.n_models} modelos - {DATA.n_datasets} datasets</span>
      </div>
      <div className="controls">
        <div className="chips">
          <button className={'chip' + (isOv ? ' active' : '')} onClick={() => setDs('__overall__')}>Overall</button>
          {DATA.datasets.map(d => (
            <button key={d} className={'chip' + (d===ds ? ' active' : '')} onClick={() => setDs(d)}>
              {DATA.datasets_meta[d] ? DATA.datasets_meta[d].display : d}
            </button>
          ))}
        </div>
        <select value={sortKey} onChange={e => { setSortKey(e.target.value); setSortDir('desc'); }}>
          {METRICS.map(m => <option key={m.key} value={m.key}>{m.label}</option>)}
        </select>
      </div>
      {isOv && (
        <div className="info-box">
          Media de cada metrica sobre todos los datasets evaluados por modelo.
          Macro-F1 binario excluye predicciones unclear.
          DS indica cuantos datasets tiene evaluados cada modelo.
        </div>
      )}
      <table>
        <thead>
          <tr>
            <th style={{width:28}}>#</th><th>Modelo</th><th>Familia</th><th>Params</th>
            {isOv && <th>Developer</th>}{isOv && <th>Release</th>}
            <SortTh k="macro_f1"        label="Macro-F1"   sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <SortTh k="macro_f1_binary" label="F1 binario" sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <SortTh k="hate_f1"         label="Hate F1"    sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <SortTh k="accuracy"        label="Accuracy"   sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <SortTh k="precision"       label="Precision"  sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <SortTh k="recall"          label="Recall"     sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <th>{isOv ? 'DS' : 'n'}</th><th>Cobertura</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => {
            const pct = maxVal > 0 ? (r[sortKey] || 0) / maxVal * 100 : 0;
            const rk = i===0 ? 'r1' : i===1 ? 'r2' : i===2 ? 'r3' : 'rank';
            const cov = r.coverage;
            const covColor = cov == null ? '#aaa' : cov >= 95 ? '#10b981' : cov >= 80 ? '#f59e0b' : '#ef4444';
            const iconUrl = FAMILY_ICON[r.family];
            return (
              <tr key={r.model}>
                <td className={rk}>{i+1}</td>
                <td>
                  {iconUrl ? <img src={iconUrl} width={16} height={16} style={{marginRight:6, verticalAlign:'middle', borderRadius:2}} onError={e => { e.target.style.display='none'; }}/> : null}
                  <b>{r.display_name || r.model}</b>
                </td>
                <td style={{color: col(r.family), fontWeight:500}}>{r.family}</td>
                <td><span className="tag">{r.params}</span></td>
                {isOv && <td style={{color:'#6b7280', fontSize:12}}>{r.developer}</td>}
                {isOv && <td style={{color:'#6b7280', fontSize:12}}>{r.release_date}</td>}
                <td>
                  <div className="bar-wrap">
                    <div className="bar-bg"><div className="bar-fill" style={{width: pct+'%', background: col(r.family)}}/></div>
                    <span style={{minWidth:44, textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{fmt(r.macro_f1, r.coverage)}</span>
                  </div>
                </td>
                <td>{fmt(r.macro_f1_binary, r.coverage)}</td>
                <td>{fmt(r.hate_f1, r.coverage)}</td>
                <td>{fmt(r.accuracy, r.coverage)}</td>
                <td>{fmt(r.precision, r.coverage)}</td>
                <td>{fmt(r.recall, r.coverage)}</td>
                <td style={{color:'#6b7280'}}>
                  {isOv ? <span className="tag-ds">{r.n_datasets}/{r.n_datasets_total}</span> : (r.n_instances ? r.n_instances.toLocaleString() : '-')}
                </td>
                <td><span className="cov-dot" style={{background: covColor}}/>{cov != null ? cov + '%' : '-'}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function HateF1Bar({DATA, ds}) {
  const ref = useRef(null);
  const chartData = useMemo(() => {
    const isOv = ds === '__overall__';
    const getF1 = m => isOv ? (DATA.overall[m]?.hate_f1||0) : (DATA.results[m]?.[ds]?.hate_f1||0);
    const models = DATA.models.filter(m => isOv ? DATA.overall[m] : DATA.results[m]?.[ds]);
    const sorted = [...models].sort((a, b) => getF1(b) - getF1(a));
    return {
      labels: sorted.map(m => DATA.models_meta[m] ? DATA.models_meta[m].display_name : m),
      values: sorted.map(m => getF1(m)),
      colors: sorted.map(m => col(DATA.models_meta[m] ? DATA.models_meta[m].family : '')),
      families: sorted.map(m => DATA.models_meta[m] ? DATA.models_meta[m].family : ''),
    };
  }, [ds, DATA]);

  useEffect(() => {
    if (!ref.current || typeof Chart === 'undefined') return;
    const ex = Chart.getChart(ref.current); if (ex) ex.destroy();
    new Chart(ref.current, {
      type: 'bar',
      data: { labels: chartData.labels, datasets: [{ data: chartData.values, backgroundColor: chartData.colors, borderRadius: 4, borderSkipped: false, _families: chartData.families }] },
      options: {
        responsive: true, maintainAspectRatio: false, layout: { padding: { top: 28 } },
        plugins: { legend: {display: false}, tooltip: {callbacks: {label: ctx => ' Hate F1: ' + ctx.raw.toFixed(4)}} },
        scales: {
          x: { grid: {display: false}, ticks: {font:{size:10}, color:'#444', maxRotation:35, minRotation:25} },
          y: { min: 0, max: 1, grid: {color:'#f0f0f0'}, ticks: {font:{size:11}, color:'#6b7280'} }
        }
      }
    });
  }, [ds, chartData]);

  return <div className="chart-box"><canvas ref={ref}/></div>;
}

const leaderLabelPlugin = {
  id: 'leaderLabel',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx; const area = chart.chartArea;
    const FONT = 10, PAD_X = 5, PAD_Y = 3, LABEL_GAP = 5, POINT_GAP = 8;
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    ctx.save(); ctx.font = `${FONT}px system-ui,sans-serif`; ctx.textBaseline = 'middle';
    const nodes = []; const offsets = [[46, -34], [-46, -34], [46, 34], [-46, 34], [70, -10], [-70, -10], [70, 10], [-70, 10], [0, -58], [0, 58], [92, -42], [-92, -42], [92, 42], [-92, 42]];
    let idx = 0;
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di); if (meta.hidden) return;
      ds.data.forEach((pt, pi) => {
        const el = meta.data[pi]; if (!el || !pt.label) return;
        const label = String(pt.label); const w = ctx.measureText(label).width + PAD_X * 2; const h = FONT + PAD_Y * 2;
        const [ox, oy] = offsets[idx % offsets.length];
        nodes.push({ id: idx, px: el.x, py: el.y, tx: el.x+ox, ty: el.y+oy, x: el.x+ox, y: el.y+oy, w, h, label, color: ds.borderColor || '#999', pointR: ds.pointRadius || 7 });
        idx += 1;
      });
    });
    if (!nodes.length) { ctx.restore(); return; }
    function clampNode(n) { n.x = clamp(n.x, area.left + n.w/2 + 2, area.right  - n.w/2 - 2); n.y = clamp(n.y, area.top  + n.h/2 + 2, area.bottom - n.h/2 - 2); }
    function pushAwayFromPoint(n) {
      const halfW = n.w/2 + n.pointR + POINT_GAP; const halfH = n.h/2 + n.pointR + POINT_GAP;
      const dx = n.x - n.px; const dy = n.y - n.py;
      const overlapX = halfW - Math.abs(dx); const overlapY = halfH - Math.abs(dy);
      if (overlapX > 0 && overlapY > 0) { if (overlapX < overlapY) n.x += (dx >= 0 ? 1 : -1) * (overlapX + 1); else n.y += (dy >= 0 ? 1 : -1) * (overlapY + 1); }
    }
    for (let iter = 0; iter < 350; iter++) {
      nodes.forEach(n => { n.x += (n.tx - n.x) * 0.025; n.y += (n.ty - n.y) * 0.025; pushAwayFromPoint(n); });
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i+1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = a.x - b.x || 0.001; const dy = a.y - b.y || 0.001;
          const overlapX = (a.w+b.w)/2 + LABEL_GAP - Math.abs(dx); const overlapY = (a.h+b.h)/2 + LABEL_GAP - Math.abs(dy);
          if (overlapX > 0 && overlapY > 0) { if (overlapX < overlapY) { const sx = dx >= 0 ? 1 : -1; a.x += sx*overlapX/2; b.x -= sx*overlapX/2; } else { const sy = dy >= 0 ? 1 : -1; a.y += sy*overlapY/2; b.y -= sy*overlapY/2; } }
        }
      }
      nodes.forEach(n => { pushAwayFromPoint(n); clampNode(n); });
    }
    for (let iter = 0; iter < 80; iter++) {
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i+1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = a.x - b.x || 0.001; const dy = a.y - b.y || 0.001;
          const overlapX = (a.w+b.w)/2 + LABEL_GAP - Math.abs(dx); const overlapY = (a.h+b.h)/2 + LABEL_GAP - Math.abs(dy);
          if (overlapX > 0 && overlapY > 0) { if (overlapX < overlapY) { const sx = dx >= 0 ? 1 : -1; a.x += sx*overlapX/2; b.x -= sx*overlapX/2; } else { const sy = dy >= 0 ? 1 : -1; a.y += sy*overlapY/2; b.y -= sy*overlapY/2; } }
        }
      }
      nodes.forEach(n => { pushAwayFromPoint(n); clampNode(n); });
    }
    nodes.forEach(n => {
      ctx.beginPath(); ctx.moveTo(n.px, n.py); ctx.lineTo(n.x, n.y);
      ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 0.8; ctx.setLineDash([2, 3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.fillRect(n.x - n.w/2, n.y - n.h/2, n.w, n.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.strokeRect(n.x - n.w/2, n.y - n.h/2, n.w, n.h);
      ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.fillText(n.label, n.x, n.y);
    });
    ctx.restore();
  }
};

function MmLeaderboard({DATA, ds, setDs}) {
  const [sortKey, setSortKey] = useState('macro_f1_binary');
  const [sortDir, setSortDir] = useState('desc');
  function onSort(k) {
    if (k === sortKey) setSortDir(d => d==='desc' ? 'asc' : 'desc');
    else { setSortKey(k); setSortDir('desc'); }
  }
  const isOv = ds === '__overall__';
  const rows = useMemo(() => {
    const r = DATA.mm_models
      .filter(m => isOv ? DATA.mm_overall[m] : DATA.mm_results[m]?.[ds])
      .map(m => ({
        model: m, display_name: DATA.mm_models_meta[m]?.display_name || m, family: DATA.mm_models_meta[m]?.family || '', params: DATA.mm_models_meta[m]?.params || '', developer: DATA.mm_models_meta[m]?.developer || '', backend: DATA.mm_models_meta[m]?.backend || 'ollama',
        ...(isOv ? DATA.mm_overall[m] : DATA.mm_results[m][ds]),
      }));
    r.sort((a, b) => sortDir==='desc' ? (b[sortKey] != null ? b[sortKey] : -1) - (a[sortKey] != null ? a[sortKey] : -1) : (a[sortKey] != null ? a[sortKey] : -1) - (b[sortKey] != null ? b[sortKey] : -1));
    return r;
  }, [ds, sortKey, sortDir, DATA]);

  const maxVal = Math.max(...rows.map(r => r[sortKey] || 0));

  return (
    <div className="section">
      <div className="section-header"><h2>Leaderboard</h2><span className="section-sub">{DATA.mm_n_models} modelos - {DATA.mm_n_datasets} datasets</span></div>
      <div className="controls">
        <div className="chips">
          <button className={'chip' + (isOv ? ' active' : '')} onClick={() => setDs('__overall__')}>Overall</button>
          {DATA.mm_datasets.map(d => (
            <button key={d} className={'chip' + (d===ds ? ' active' : '')} onClick={() => setDs(d)}>{d}</button>
          ))}
        </div>
        <select value={sortKey} onChange={e => { setSortKey(e.target.value); setSortDir('desc'); }}>
          <option value="macro_f1_binary">Macro-F1 binario</option>
          <option value="hate_f1">Hate F1</option>
          <option value="macro_f1">Macro-F1</option>
          <option value="accuracy">Accuracy</option>
          <option value="precision">Precision</option>
          <option value="recall">Recall</option>
        </select>
      </div>
      {isOv && (
        <div className="info-box">
          Media de cada metrica sobre todos los datasets evaluados por modelo.
          Macro-F1 binario excluye predicciones unclear.
          DS indica cuantos datasets tiene evaluados cada modelo.
        </div>
      )}
      <table>
        <thead>
          <tr>
            <th style={{width:28}}>#</th>
            <th>Modelo</th><th>Familia</th><th>Params</th><th>Backend</th>
            {isOv && <th>Developer</th>}{isOv && <th>DS</th>}
            <SortTh k="macro_f1_binary" label="Macro-F1 bin" sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <SortTh k="hate_f1"         label="Hate F1"      sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <SortTh k="macro_f1"        label="Macro-F1"     sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <SortTh k="accuracy"        label="Accuracy"     sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
            <th>Cobertura</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => {
            const pct = maxVal > 0 ? (r[sortKey] || 0) / maxVal * 100 : 0;
            const rk = i===0 ? 'r1' : i===1 ? 'r2' : i===2 ? 'r3' : 'rank';
            const covColor = r.coverage >= 95 ? '#10b981' : r.coverage >= 80 ? '#f59e0b' : '#ef4444';
            const iconUrl = FAMILY_ICON[r.family];
            return (
              <tr key={r.model}>
                <td className={rk}>{i+1}</td>
                <td>
                  {iconUrl ? <img src={iconUrl} width={16} height={16} style={{marginRight:6, verticalAlign:'middle', borderRadius:2}} onError={e => { e.target.style.display='none'; }}/> : null}
                  <b>{r.display_name || r.model}</b>
                </td>
                <td style={{color: col(r.family), fontWeight:500}}>{r.family}</td>
                <td><span className="tag">{r.params}</span></td>
                <td><span className={'tag-backend ' + (r.backend==='vllm' ? 'vllm' : 'ollama')}>{r.backend}</span></td>
                {isOv && <td style={{color:'#6b7280', fontSize:12}}>{r.developer}</td>}
                {isOv && <td><span className="tag-ds">{r.n_datasets}/{r.n_datasets_total}</span></td>}
                <td>
                  <div className="bar-wrap">
                    <div className="bar-bg"><div className="bar-fill" style={{width: pct+'%', background: col(r.family)}}/></div>
                    <span style={{minWidth:44, textAlign:'right', fontVariantNumeric:'tabular-nums'}}>{r.macro_f1_binary != null ? r.macro_f1_binary.toFixed(4) : '-'}</span>
                  </div>
                </td>
                <td>{r.hate_f1 != null ? r.hate_f1.toFixed(4) : '-'}</td>
                <td>{r.macro_f1 != null ? r.macro_f1.toFixed(4) : '-'}</td>
                <td>{r.accuracy != null ? r.accuracy.toFixed(4) : '-'}</td>
                <td><span className="cov-dot" style={{background: covColor}}/>{r.coverage != null ? r.coverage + '%' : '-'}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );

      <MmLeaderboard DATA={DATA} ds={ds} setDs={setDs}/>
      <MmGraficos DATA={DATA} ds={ds}/>
      <MmHistory DATA={DATA}/>
    </div>
  );
}

function App() {
  const [DATA, setDATA] = useState(null);
  const [err, setErr] = useState(null);
  const [ds, setDs] = useState('__overall__');

  useEffect(() => {
    fetch('runs_index.json', {cache: 'no-store'})
      .then(res => { if (!res.ok) throw new Error('runs_index.json -> HTTP ' + res.status); return res.json(); })
      .then(d => setDATA(d))
      .catch(e => { console.error("Error cargando runs_index.json:", e); setErr(e.message || String(e)); });
  }, []);

  if (err) {
    return (
      <div className="wrap">
        <div className="fatal-box">
          <h2>No se pudo cargar runs_index.json</h2>
          <p>{err}</p>
          <p className="hint">Asegurate de que el deploy publica tambien <b>docs/runs_index.json</b> (no solo index.html)
          y de que esta en la misma carpeta que la pagina.</p>
        </div>
      </div>
    );
  }

  if (!DATA) {
    return (
      <div className="wrap" style={{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'80vh', textAlign:'center'}}>
        <div className="live" style={{width:12, height:12, marginBottom:15}}></div>
        <h1 style={{fontSize:20, fontWeight:600, color:'#1a1a1a', marginBottom:5}}>Cargando Benchmark...</h1>
        <p style={{color:'#6b7280', fontSize:13}}>Leyendo datos de evaluación, por favor espera.</p>
      </div>
    );
  }

  const gen = DATA.generated ? DATA.generated.slice(0,16).replace('T',' ') + ' UTC' : '';
  return (
    <div>
      <a className="gh-btn" href="https://github.com/AritzUMA/hate-speech-bench-es" target="_blank" rel="noopener">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        AritzUMA/hate-speech-bench-es
      </a>
      <div className="wrap">
        <div className="header">
          <h1>
            Nutcracker Benchmark
          </h1>
          <div className="header-meta">
            Actualizado: {gen}
          </div>
          <div className="header-desc">
            Nutcracker es un benchmark continuo y abierto para evaluar modelos de lenguaje en la deteccion de discurso de odio en espanol. El proyecto se divide en dos benchmarks: el primero es puramente de texto (SLMs) y el segundo se centra exclusivamente en imagen (VLMs). Todos los modelos se evaluan en modo zero-shot mediante prompts JSON estructurados, sin fine-tuning ni adaptacion especifica a los datasets, utilizando motores de inferencia como Ollama y vLLM. Se utiliza temperatura=0 para maximizar el determinismo de las respuestas. Las predicciones se clasifican en dos clases: hate y no_hate.
          </div>

        </div>
        <div style={{margin:'0 0 1.5rem', paddingBottom:'1rem', borderBottom:'2px solid #e0e0e0'}}>
          <h2 style={{fontSize:20, fontWeight:700, letterSpacing:'-.3px'}}>Benchmark de Texto</h2>
          <div style={{fontSize:13, color:'#6b7280', marginTop:4}}>
            {DATA.n_models} modelos — {DATA.n_datasets} datasets — {DATA.n_runs} evaluaciones
          </div>
        </div>
        <Leaderboard DATA={DATA} ds={ds} setDs={setDs}/>
        <Graficos DATA={DATA} ds={ds}/>
        <Datasets DATA={DATA}/>
        <History DATA={DATA}/>
        <MultimodalSection DATA={DATA}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
