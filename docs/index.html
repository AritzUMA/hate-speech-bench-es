  const isOv = ds==='__overall__';
  const maxVal = Math.max(...rows.map(r=>r[sortKey]||0));

  return (
    <div>
      <div className="controls">
        <div className="chips">
          <button className={'chip'+(isOv?' active':'')} onClick={()=>setDs('__overall__')}>★ Overall</button>
          {DATA.datasets.map(d=>(
            <button key={d} className={'chip'+(d===ds?' active':'')} onClick={()=>setDs(d)}>
              {DATA.datasets_meta[d]?.display||d}
            </button>
          ))}
        </div>
        <select value={sortKey} onChange={e=>{setSortKey(e.target.value);setSortDir('desc');}}>
          {METRICS.map(m=><option key={m.key} value={m.key}>{m.label}</option>)}
        </select>
      </div>
      {isOv && <div className="info-box">Media de cada métrica sobre todos los datasets evaluados. <b>Macro-F1 binario</b> excluye las predicciones <i>unclear</i>. La columna <b>DS</b> indica cuántos datasets tiene evaluados.</div>}
      <table>
        <thead><tr>
          <th style={{width:28}}>#</th>
          <th>Modelo</th>
          <th>Familia</th>
          <th>Params</th>
          {isOv && <th>Developer</th>}
          {isOv && <th>Release</th>}
          <SortTh k="macro_f1"        label="Macro-F1"       sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
          <SortTh k="macro_f1_binary" label="F1 binario"     sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
          <SortTh k="hate_f1"         label="Hate F1"        sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
          <SortTh k="accuracy"        label="Accuracy"       sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
          <SortTh k="precision"       label="Precisión"      sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
          <SortTh k="recall"          label="Recall"         sortKey={sortKey} sortDir={sortDir} onSort={onSort}/>
          <th>{isOv?'DS':'n'}</th>
          {isOv && <th>Cobertura</th>}
        </tr></thead>
        <tbody>
          {rows.map((r,i)=>{
            const pct = maxVal>0?(r[sortKey]||0)/maxVal*100:0;
            const rk = i===0?'r1':i===1?'r2':i===2?'r3':'rank';
            const cov = r.coverage;
            const covColor = cov===undefined?'#aaa':cov>=95?'#10b981':cov>=80?'#f59e0b':'#ef4444';
            return <tr key={r.model}>
              <td className={rk}>{i+1}</td>
              <td><b>{r.model}</b></td>
              <td style={{color:'#888'}}>{r.family}</td>
              <td><span className="tag">{r.params}</span></td>
              {isOv && <td style={{color:'#888',fontSize:12}}>{r.developer}</td>}
              {isOv && <td style={{color:'#888',fontSize:12}}>{r.release_date}</td>}
              <td><div className="bar-wrap">
                <div className="bar-bg"><div className="bar-fill" style={{width:pct+'%',background:col(r.family)}}/></div>
                <span style={{minWidth:44,textAlign:'right',fontVariantNumeric:'tabular-nums'}}>{fmt(r.macro_f1)}</span>
              </div></td>
              <td>{fmt(r.macro_f1_binary)}</td>
              <td>{fmt(r.hate_f1)}</td>
              <td>{fmt(r.accuracy)}</td>
              <td>{fmt(r.precision)}</td>
              <td>{fmt(r.recall)}</td>
              <td style={{color:'#aaa'}}>{isOv?<span className="tag-ds">{r.n_datasets}/{r.n_datasets_total}</span>:r.n_instances?.toLocaleString()}</td>
              {isOv && <td><span className="coverage-dot" style={{background:covColor}}/>{cov!=null?cov+'%':'—'}</td>}
            </tr>;
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Visualizaciones ───────────────────────────────────────────────────────────
function ScatterChart({canvasId, datasets, title}) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const existing = Chart.getChart(ref.current);
    if (existing) existing.destroy();
    new Chart(ref.current, {
      type: 'scatter',
      data: { datasets },
      options: {
        responsive: true,
        plugins: {
          legend: { display: datasets.length > 1, position: 'bottom', labels: {boxWidth:10,font:{size:11}} },
          tooltip: {
            callbacks: {
              label: ctx => `${ctx.raw.label}: (${ctx.raw.x}, ${ctx.raw.y?.toFixed(4)})`,
            }
          }
        },
        scales: {
          x: { grid:{color:'#f0f0f0'}, ticks:{font:{size:11},color:'#888'} },
          y: { min:0, max:1, grid:{color:'#f0f0f0'}, ticks:{font:{size:11},color:'#888'} }
        }
      }
    });
  }, [datasets]);
  return <canvas ref={ref} height={200}/>;
}

function RadarChart({model}) {
  const ref = useRef(null);
  const ov = DATA.overall[model];
  useEffect(() => {
    if (!ref.current || !ov) return;
    const existing = Chart.getChart(ref.current);
    if (existing) existing.destroy();
    const family = DATA.models_meta[model]?.family||'';
    const c = col(family);
    new Chart(ref.current, {
      type: 'radar',
      data: {
        labels: ['Macro-F1','Hate F1','Precisión','Recall','Accuracy'],
        datasets: [{
          label: model,
          data: [ov.macro_f1,ov.hate_f1,ov.precision,ov.recall,ov.accuracy].map(v=>v||0),
          borderColor: c,
          backgroundColor: c+'33',
          pointBackgroundColor: c,
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { r: {
          min:0, max:1,
          ticks: {stepSize:0.25,font:{size:10},color:'#aaa'},
          grid: {color:'#e8e8e8'},
          pointLabels: {font:{size:11},color:'#555'}
        } }
      }
    });
  }, [model]);
  return <canvas ref={ref} height={180}/>;
}

function HeatmapView() {
  const models  = DATA.models.filter(m=>DATA.overall[m]);
  const datasets = DATA.datasets;

  function getColor(v) {
    if (v==null) return '#f5f5f5';
    const r = Math.round(255*(1-v));
    const g = Math.round(180*v+50);
    return `rgb(${r},${g},80)`;
  }

  return (
    <div>
      <div className="chart-wrap">
        <div className="chart-title">Macro-F1 por modelo × dataset</div>
        <div className="heatmap-wrap">
          <table className="heatmap-table">
            <thead><tr>
              <th style={{textAlign:'left',minWidth:180}}>Modelo</th>
              {datasets.map(d=><th key={d}>{DATA.datasets_meta[d]?.display||d}</th>)}
              <th>Media</th>
            </tr></thead>
            <tbody>
              {models.sort((a,b)=>(DATA.overall[b]?.macro_f1||0)-(DATA.overall[a]?.macro_f1||0)).map(m=>{
                const ov = DATA.overall[m];
                return <tr key={m}>
                  <td style={{padding:'2px 8px 2px 0',fontSize:12,whiteSpace:'nowrap',color:'#444'}}>{m}</td>
                  {datasets.map(d=>{
                    const v = DATA.results[m]?.[d]?.macro_f1;
                    return <td key={d}><div className="heatmap-cell"
                      style={{background:getColor(v),color:v!=null?(v>0.5?'#fff':'#333'):'#ccc',minWidth:70}}
                      title={`${m} × ${d}: ${v?.toFixed(4)||'—'}`}>
                      {v!=null?v.toFixed(3):'—'}
                    </div></td>;
                  })}
                  <td><div className="heatmap-cell"
                    style={{background:getColor(ov?.macro_f1),color:(ov?.macro_f1||0)>0.5?'#fff':'#333',minWidth:60,fontWeight:600}}>
                    {ov?.macro_f1?.toFixed(3)||'—'}
                  </div></td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function Graficos() {
  const models = DATA.models.filter(m => DATA.overall[m]);
  const [selectedModel, setSelectedModel] = useState(models[0]||'');

  // Scatter: F1 vs Release date
  const scatterRelease = useMemo(() => {
    const byFamily = {};
    models.forEach(m => {
      const meta = DATA.models_meta[m]||{};
      const f = meta.family||'Otro';
      if (!byFamily[f]) byFamily[f] = [];
      const rd = meta.release_date||'';
      const [y,mo] = rd.split('-').map(Number);
      if (!y) return;
      const x = y + (mo-1)/12;
      byFamily[f].push({x, y: DATA.overall[m]?.macro_f1||0, label: m});
    });
    return Object.entries(byFamily).map(([f,data]) => ({
      label: f, data,
      backgroundColor: col(f)+'cc',
      borderColor: col(f),
      pointRadius: 7, pointHoverRadius: 9,
    }));
  }, []);

  // Scatter: F1 vs Params
  const scatterParams = useMemo(() => {
    const byFamily = {};
    models.forEach(m => {
      const meta = DATA.models_meta[m]||{};
      const f = meta.family||'Otro';
      if (!byFamily[f]) byFamily[f] = [];
      const p = parseFloat((meta.params||'0').replace('B',''));
      if (!p) return;
      byFamily[f].push({x: p, y: DATA.overall[m]?.macro_f1||0, label: m});
    });
    return Object.entries(byFamily).map(([f,data]) => ({
      label: f, data,
      backgroundColor: col(f)+'cc',
      borderColor: col(f),
      pointRadius: 7, pointHoverRadius: 9,
    }));
  }, []);

  return (
    <div>
      <div className="grid-2">
        <div className="chart-wrap">
          <div className="chart-title">Macro-F1 vs Fecha de lanzamiento</div>
          <ScatterChart canvasId="scatter-release" datasets={scatterRelease} title="F1 vs Release"/>
        </div>
        <div className="chart-wrap">
          <div className="chart-title">Macro-F1 vs Tamaño del modelo (B params)</div>
          <ScatterChart canvasId="scatter-params" datasets={scatterParams} title="F1 vs Params"/>
        </div>
      </div>

      <div className="section-title">Perfil de métricas por modelo (radar)</div>
      <div style={{marginBottom:10}}>
        <select value={selectedModel} onChange={e=>setSelectedModel(e.target.value)}>
          {models.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </div>
      <div className="grid-3">
        {models.slice(0,6).map(m=>(
          <div key={m} className="chart-wrap">
            <div className="chart-title" style={{color:col(DATA.models_meta[m]?.family||'')}}>{m}</div>
            <RadarChart model={m}/>
          </div>
        ))}
      </div>
      {models.length>6 && (
        <div className="grid-3">
          {models.slice(6,12).map(m=>(
            <div key={m} className="chart-wrap">
              <div className="chart-title" style={{color:col(DATA.models_meta[m]?.family||'')}}>{m}</div>
              <RadarChart model={m}/>
            </div>
          ))}
        </div>
      )}

      <div className="section-title" style={{marginTop:'1.5rem'}}>Heatmap modelo × dataset</div>
      <HeatmapView/>
    </div>
  );
}

// ── Datasets ──────────────────────────────────────────────────────────────────
function Datasets() {
  return (
    <table>
      <thead><tr>
        <th>Dataset</th><th>Paper</th><th>Plataforma</th><th>Fuente</th>
        <th style={{textAlign:'right'}}>Total</th>
        <th style={{textAlign:'right'}}>Hate</th>
        <th style={{textAlign:'right'}}>No hate</th>
        <th>IAA</th><th>Tema</th><th>Lengua</th>
      </tr></thead>
      <tbody>
        {DATA.datasets.map(d=>{
          const m = DATA.datasets_meta[d]||{};
          return <tr key={d}>
            <td><b>{m.display||d}</b></td>
            <td style={{color:'#888',fontSize:11}}>{m.paper}</td>
            <td>{m.platform}</td>
            <td style={{color:'#888'}}>{m.source}</td>
            <td style={{textAlign:'right'}}>{m.n_total?.toLocaleString()}</td>
            <td style={{textAlign:'right',color:'#ef4444'}}>{m.hate?.toLocaleString()}</td>
            <td style={{textAlign:'right',color:'#10b981'}}>{m.no_hate?.toLocaleString()}</td>
            <td style={{fontSize:11}}>{m.iaa||'—'}</td>
            <td style={{fontSize:11,color:'#888'}}>{m.topic}</td>
            <td><span className="tag">{m.lang}</span></td>
          </tr>;
        })}
      </tbody>
    </table>
  );
}

// ── Historial ─────────────────────────────────────────────────────────────────
function History() {
  return (
    <table>
      <thead><tr>
        <th>Fecha</th><th>Modelo</th><th>Dataset</th>
        <th style={{textAlign:'right'}}>Macro-F1</th>
        <th style={{textAlign:'right'}}>Hate F1</th>
        <th style={{textAlign:'right'}}>Tiempo (s)</th>
      </tr></thead>
      <tbody>
        {DATA.history.map((r,i)=>(
          <tr key={i}>
            <td style={{color:'#aaa'}}>{r.ts}</td>
            <td><b>{r.model}</b></td>
            <td>{DATA.datasets_meta[r.dataset]?.display||r.dataset}</td>
            <td style={{textAlign:'right'}}><b>{fmt(r.f1)}</b></td>
            <td style={{textAlign:'right'}}>{fmt(r.hate_f1)}</td>
            <td style={{textAlign:'right',color:'#aaa'}}>{r.elapsed??'—'}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('leaderboard');
  const gen = DATA.generated?.slice(0,16).replace('T',' ') + ' UTC';
  const TABS = [
    {id:'leaderboard', label:'Leaderboard'},
    {id:'graficos',    label:'Gráficos'},
    {id:'datasets',    label:'Datasets'},
    {id:'historial',   label:'Historial'},
  ];

  return (
    <div className="wrap">
      <h1><span className="live"/>Detección de Discurso de Odio en Español — Benchmark Continuo</h1>
      <div className="subtitle">Evaluación de modelos locales via Ollama · RTX 4070 Ti Super · 16GB VRAM</div>
      <div className="meta">Generado: {gen} · {DATA.n_runs} evaluaciones · {DATA.n_models} modelos · {DATA.n_datasets} datasets</div>

      <div className="stats">
        <div className="stat">
          <div className="lbl">Modelos evaluados</div>
          <div className="val">{DATA.n_models}</div>
          <div className="sub">modelos de lenguaje local</div>
        </div>
        <div className="stat">
          <div className="lbl">Datasets</div>
          <div className="val">{DATA.n_datasets}</div>
          <div className="sub">benchmarks en español</div>
        </div>
        <div className="stat">
          <div className="lbl">Evaluaciones</div>
          <div className="val">{DATA.n_runs}</div>
          <div className="sub">combinaciones modelo × dataset</div>
        </div>
        <div className="stat">
          <div className="lbl">Mejor Macro-F1</div>
          <div className="val">{DATA.best_overall_f1}</div>
          <div className="sub">media sobre todos los datasets</div>
        </div>
      </div>

      <div className="nav">
        {TABS.map(t=>(
          <button key={t.id} className={'nav-tab'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>

      {tab==='leaderboard' && <Leaderboard/>}

      {tab==='historial'   && <History/>}

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
