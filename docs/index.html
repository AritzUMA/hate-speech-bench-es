      const av = a[sortKey] ?? -1;
      const bv = b[sortKey] ?? -1;
      return sortDir === 'desc' ? bv - av : av - bv;
    });
    return r;
  }, [ds, sortKey, sortDir]);

  const maxVal = Math.max(...rows.map(r => r[sortKey] || 0));

  function SortTh({ k, label }) {
    return (
      <th onClick={() => handleSort(k)}>
        {label}
        <span className="sort-arrow">
          {sortKey === k ? (sortDir === 'desc' ? ' ↓' : ' ↑') : ' ↕'}
        </span>
      </th>
    );
  }

  return (
    <div>
      <div className="controls">
        <div className="chips">
          {datasets.map(d => (
            <button key={d} className={'chip' + (d === ds ? ' active' : '')}
              onClick={() => setDs(d)}>
              {DATA.datasets_meta[d]?.display || d}
            </button>
          ))}
        </div>
        <select value={metric} onChange={e => { setMetric(e.target.value); setSortKey(e.target.value); }}>
          {METRICS.map(m => <option key={m.key} value={m.key}>{m.label}</option>)}
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th style={{width:28}}>#</th>
            <th>Modelo</th>
            <th>Familia</th>
            <th>Params</th>
            <SortTh k="macro_f1"  label="Macro-F1" />
            <SortTh k="hate_f1"   label="Hate F1" />
            <SortTh k="accuracy"  label="Accuracy" />
            <SortTh k="precision" label="Precisión" />
            <SortTh k="recall"    label="Recall" />
            <th>n</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => {
            const pct = maxVal > 0 ? (r[sortKey] || 0) / maxVal * 100 : 0;
            const rk  = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : 'rank';
            return (
              <tr key={r.model}>
                <td className={rk}>{i + 1}</td>
                <td><b>{r.model}</b></td>
                <td style={{color:'#888'}}>{r.family}</td>
                <td><span className="tag">{r.params}</span></td>
                <td>
                  <div className="bar-wrap">
                    <div className="bar-bg">
                      <div className="bar-fill"
                        style={{width: pct + '%', background: color(r.family)}} />
                    </div>
                    <span style={{minWidth:46,textAlign:'right',fontVariantNumeric:'tabular-nums'}}>
                      {fmt(r.macro_f1)}
                    </span>
                  </div>
                </td>
                <td>{fmt(r.hate_f1)}</td>
                <td>{fmt(r.accuracy)}</td>
                <td>{fmt(r.precision)}</td>
                <td>{fmt(r.recall)}</td>
                <td style={{color:'#aaa'}}>{r.n_instances}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Datasets ──────────────────────────────────────────────────────────────────
function Datasets() {
  return (
    <table>
      <thead>
        <tr>
          <th>Dataset</th>
          <th>Paper</th>
          <th>Plataforma</th>
          <th>Fuente</th>
          <th style={{textAlign:'right'}}>Total</th>
          <th style={{textAlign:'right'}}>Hate</th>
          <th style={{textAlign:'right'}}>No hate</th>
          <th>IAA</th>
          <th>Tema</th>
          <th>Lengua</th>
        </tr>
      </thead>
      <tbody>
        {DATA.datasets.map(d => {
          const m = DATA.datasets_meta[d] || {};
          return (
            <tr key={d}>
              <td><b>{m.display || d}</b></td>
              <td style={{color:'#888',fontSize:11}}>{m.paper}</td>
              <td>{m.platform}</td>
              <td style={{color:'#888'}}>{m.source}</td>
              <td style={{textAlign:'right'}}>{m.n_total?.toLocaleString()}</td>
              <td style={{textAlign:'right',color:'#c04820'}}>{m.hate?.toLocaleString()}</td>
              <td style={{textAlign:'right',color:'#1D9E75'}}>{m.no_hate?.toLocaleString()}</td>
              <td style={{fontSize:11}}>{m.iaa || '—'}</td>
              <td style={{fontSize:11,color:'#888'}}>{m.topic}</td>
              <td><span className="tag">{m.lang}</span></td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

// ── Historial ─────────────────────────────────────────────────────────────────
function History() {
  return (
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Modelo</th>
          <th>Dataset</th>
          <th style={{textAlign:'right'}}>Macro-F1</th>
          <th style={{textAlign:'right'}}>Hate F1</th>
          <th style={{textAlign:'right'}}>Tiempo (s)</th>
        </tr>
      </thead>
      <tbody>
        {DATA.history.map((r, i) => (
          <tr key={i}>
            <td style={{color:'#aaa'}}>{r.ts}</td>
            <td><b>{r.model}</b></td>
            <td>{DATA.datasets_meta[r.dataset]?.display || r.dataset}</td>
            <td style={{textAlign:'right'}}><b>{fmt(r.f1)}</b></td>
            <td style={{textAlign:'right'}}>{fmt(r.hate_f1)}</td>
            <td style={{textAlign:'right',color:'#aaa'}}>{r.elapsed ?? '—'}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('leaderboard');
  const gen = DATA.generated?.slice(0, 16).replace('T', ' ') + ' UTC';

  return (
    <div className="wrap">
      <h1><span className="live" />Hate Speech ES — Living Benchmark</h1>
      <p className="meta">
        Generado: {gen} · {DATA.n_runs} evaluaciones ·
        {DATA.n_models} modelos · {DATA.n_datasets} datasets ·
        Modelos locales via Ollama (ic4 · UMA)
      </p>

      <div className="stats">
        <div className="stat">
          <div className="lbl">Modelos evaluados</div>
          <div className="val">{DATA.n_models}</div>
        </div>
        <div className="stat">
          <div className="lbl">Datasets</div>
          <div className="val">{DATA.n_datasets}</div>
        </div>
        <div className="stat">
          <div className="lbl">Evaluaciones</div>
          <div className="val">{DATA.n_runs}</div>
        </div>
        <div className="stat">
          <div className="lbl">Mejor Macro-F1</div>
          <div className="val">
            {Math.max(...Object.values(DATA.avg_f1)).toFixed(3)}
          </div>
        </div>
      </div>

      <div className="tabs">
        {['leaderboard','datasets','historial'].map(t => (
          <button key={t} className={'tab' + (tab === t ? ' active' : '')}
            onClick={() => setTab(t)}>
            {t.charAt(0).toUpperCase() + t.slice(1)}
          </button>
        ))}
      </div>

      {tab === 'leaderboard' && <Leaderboard />}
      {tab === 'datasets'    && <Datasets />}
      {tab === 'historial'   && <History />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
