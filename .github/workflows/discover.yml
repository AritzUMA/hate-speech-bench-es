name: Discover new Ollama models

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pyyaml

      - name: Discover candidates
        run: |
          python scripts/discover_models.py
          echo "--- pending_candidates.json ---"
          cat pending_candidates.json

      - name: Open issue if hay candidatos
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const jsonPath = path.join(process.env.GITHUB_WORKSPACE, 'pending_candidates.json');
            const candidates = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            if (!candidates.length) {
              console.log('Sin candidatos nuevos esta semana.');
              return;
            }
            const rows = candidates
              .filter(c => c.sizes.length > 0)
              .slice(0, 30)
              .map(c =>
                `- [ ] \`${c.name}\` — ${c.sizes.join(', ')} — ` +
                `${c.pulls.toLocaleString()} pulls`
              ).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `New Ollama models (${new Date().toISOString().slice(0,10)})`,
              body: [
                '## Candidatos no evaluados aun',
                '',
                rows,
                '',
                '---',
                '**Para añadir un modelo:**',
                '1. `ollama pull <nombre>` en ic4',
                '2. Añade entrada en `registry/models.yaml`',
                '3. `bash scripts/submit_benchmark.sh`',
                '4. Marca el checkbox y cierra el issue',
              ].join('\n'),
              labels: ['model-discovery'],
            });
